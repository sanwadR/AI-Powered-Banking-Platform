spring:
  application:
    name: banking-core

  # ===== DATABASE CONNECTION =====
  datasource:
    url: jdbc:postgresql://localhost:5432/bankingdb
    username: bankuser
    password: bankpass
    driver-class-name: org.postgresql.Driver
    # Connection pool settings (HikariCP is built into Spring Boot)
    hikari:
      pool-name: BankingPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000   # 30 seconds
      idle-timeout: 600000        # 10 minutes

  # ===== JPA / HIBERNATE =====
  jpa:
    hibernate:
      # IMPORTANT: Use 'validate' in production. Flyway manages schema, not Hibernate.
      ddl-auto: validate
    show-sql: false       # Set to true if you want to see SQL queries in console
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ===== FLYWAY (Database Migrations) =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ===== SERVER =====
server:
  port: 8080
  error:
    include-message: always    # Show error messages in responses (dev only)
    include-binding-errors: always

# ===== JWT SETTINGS =====
# IMPORTANT: In production, move the secret to environment variables, never hardcode it
jwt:
  secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
  expiration-ms: 86400000   # 24 hours in milliseconds

# ===== SWAGGER / API DOCS =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

# ===== ACTUATOR (Health Checks) =====
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ===== LOGGING =====
logging:
  level:
    com.bank: DEBUG           # Show our own code's debug logs
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
